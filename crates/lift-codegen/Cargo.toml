[package]
name = "lift-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "LIFT compiler code generator: define AI and quantum models from Rust, emit .lif, .lith, .ll, .onnx, .qasm files"
readme = "../../README.md"
keywords = ["codegen", "compiler", "model", "ir", "onnx"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "lift-codegen"
path = "src/main.rs"

[dependencies]
lift-core = { workspace = true }
lift-ast = { workspace = true }
lift-sim = { workspace = true }
lift-opt = { workspace = true }
lift-export = { workspace = true }
lift-config = { workspace = true }
lift-predict = { workspace = true }
