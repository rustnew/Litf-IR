name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Publish in topological dependency order:
      #   level 0: core, config (no lift deps)
      #   level 1: ast, tensor, quantum (depend on core)
      #   level 2: export, hybrid, import, opt, sim (core+quantum+tensor)
      #   level 3: predict (adds sim)
      #   level 4: codegen (adds ast/config/export/opt/predict/sim)
      #   level 5: cli (all)
      - name: Publish all crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -e
          for crate in \
            lift-tensor lift-quantum \
            lift-export lift-hybrid lift-import lift-opt lift-sim \
            lift-predict \
            lift-codegen \
            lift-cli
          do
            echo "==> Publishing $crate"
            # crates.io's index can lag a few seconds behind a just-published
            # dependency (seen in the wild: publishing lift-ast succeeds and
            # immediately resolves lift-core from the index, then the very
            # next crate fails to resolve the same dependency). Retry a
            # transient failure a couple of times before giving up; a crate
            # that's already on the registry at this version would fail
            # every attempt identically, so this doesn't mask real errors.
            for attempt in 1 2 3; do
              if cargo publish -p "$crate"; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::Failed to publish $crate after 3 attempts"
                exit 1
              fi
              echo "Publish of $crate failed (attempt $attempt/3), retrying in 20s..."
              sleep 20
            done
          done
          echo "All crates published"
