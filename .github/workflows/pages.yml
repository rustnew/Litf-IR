name: github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare mdbook sources
        run: |
          cp README.md CHANGELOG.md CONTRIBUTING.md book/src/
          cp docs/LIFT_Guide.md docs/LIFT_Manual.md docs/CAPABILITIES.md \
             docs/DIALECTS.md docs/LIFT_design.md docs/PUBLISHING.md \
             docs/STRATEGY.md docs/ROADMAP-v0.5.md docs/ANNOUNCEMENTS.md book/src/

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.40'

      - name: Build book
        run: mdbook build book

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
